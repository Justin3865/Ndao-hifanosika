# Ndao Hifanosika — orchestration commune
name: ndao-hifanosika

x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 4000
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  TWO_FACTOR_KEY: ${TWO_FACTOR_KEY}
  FRONTEND_URL: ${FRONTEND_URL}
  CORS_ORIGIN: ${CORS_ORIGIN}
  AI_SERVICE_URL: http://ia:8000
  ML_SERVICE_URL: http://ml:8001
  AI_SERVICE_KEY: ${AI_SERVICE_KEY}
  COORDINATOR_SCOPE: ${COORDINATOR_SCOPE:-}
  REDIS_URL: ${REDIS_URL:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  migrate:
    build: { context: "${BACKEND_DIR:-../srcb}" }
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  backend:
    build: { context: "${BACKEND_DIR:-../srcb}" }
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    networks: [internal]

  frontend:
    build:
      context: "${FRONTEND_DIR:-../srcf}"
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks: [internal]

  ia:
    build: { context: "${AI_DIR:-../IA}" }
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
      AI_SERVICE_KEY: ${AI_SERVICE_KEY}
    depends_on: [backend]
    networks: [internal] # jamais exposé à Internet
    expose: ["8000"]

  ml:
    build: { context: "${ML_DIR:-../ML}" }
    restart: unless-stopped
    networks: [internal]
    expose: ["8001"]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do /usr/local/bin/backup.sh || echo 'ECHEC sauvegarde'; sleep $$((BACKUP_EVERY_HOURS*3600)); done"]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  redis:
    image: redis:7-alpine
    profiles: ["queue"]
    restart: unless-stopped
    networks: [internal]

volumes:
  pgdata:
  uploads:
  backups:

networks:
  internal:
