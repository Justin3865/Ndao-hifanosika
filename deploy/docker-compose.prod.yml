# Production : seul Caddy est exposé (HTTPS automatique). Nécessite Docker Compose >= 2.24 pour !reset.
services:
  backend:
    ports: !reset []
    environment:
      NODE_ENV: production
  frontend:
    ports: !reset []
    environment:
      NODE_ENV: production
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
    networks: [internal]

volumes:
  caddy_data:
  caddy_config:
