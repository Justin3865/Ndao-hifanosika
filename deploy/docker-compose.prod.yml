# Environnement de PRODUCTION : HTTPS automatique (Caddy), aucun port applicatif exposé directement.
services:
  back:
    environment:
      NODE_ENV: production
    ports: !reset []
    expose: ["4000"]
  front:
    ports: !reset []
    expose: ["3000"]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?définir APP_DOMAIN (ex. suivi.ndao-hifanosika.org)}
      API_DOMAIN: ${API_DOMAIN:?définir API_DOMAIN (ex. api.ndao-hifanosika.org)}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [front, back]
volumes:
  caddy_data:
  caddy_config:
