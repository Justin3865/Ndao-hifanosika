name: CI/CD
on:
  push: { branches: [main, develop] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: srcb } }
    env: { DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: srcb/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run test:unit

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: srcf } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: srcf/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [IA, ML] }
    defaults: { run: { working-directory: "${{ matrix.service }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "${{ matrix.service }}/requirements.txt" }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  scope-integration:
    needs: backend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: srcb } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ndao, POSTGRES_PASSWORD: test, POSTGRES_DB: ndao_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ndao -d ndao_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ndao:test@localhost:5432/ndao_test
      JWT_SECRET: ci-secret-jwt-0123456789012345678901234567890123456789
      JWT_REFRESH_SECRET: ci-secret-refresh-01234567890123456789012345678901234
      TWO_FACTOR_KEY: ci-two-factor-key-0123456789abcdef
      AI_SERVICE_KEY: ci-service-key
      NODE_ENV: development
      PORT: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: srcb/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/create-admin.ts
      - name: Périmètre coordinateurs (mode transition)
        run: |
          npx tsx src/server.ts > /tmp/api.log 2>&1 &
          API_PID=$!
          for i in $(seq 1 40); do curl -fsS http://localhost:4000/health && break; sleep 2; done
          node tests-http/t6-scope.mjs
          kill $API_PID || true
      - name: Périmètre coordinateurs (mode strict)
        run: |
          COORDINATOR_SCOPE=strict npx tsx src/server.ts > /tmp/api-strict.log 2>&1 &
          API_PID=$!
          for i in $(seq 1 40); do curl -fsS http://localhost:4000/health && break; sleep 2; done
          STRICT=1 node tests-http/t6-scope.mjs
          kill $API_PID || true
      - if: failure()
        run: tail -n 80 /tmp/api.log /tmp/api-strict.log || true

  images:
    needs: [backend, frontend, python, scope-integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -t ndao/backend ./srcb
          docker build -t ndao/ia ./IA
          docker build -t ndao/ml ./ML
          docker build -t ndao/frontend ./srcf

  deploy-staging:
    needs: images
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ secrets.STAGING_PATH }} && git pull --ff-only
            cd deploy && docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml up -d --build

  deploy-production:
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # activer « Required reviewers » dans GitHub
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ${{ secrets.PROD_PATH }} && git pull --ff-only
            cd deploy && docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
